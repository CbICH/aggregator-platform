name: fsp-signal
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: signal
      POSTGRES_DB: signal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signal-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:54329:5432"
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://signal:${POSTGRES_PASSWORD:-signal-local-only}@db:5432/signal
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@signal.local
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:

